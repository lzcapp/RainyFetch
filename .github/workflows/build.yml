name: build

on:
  push:
    branches: [ main ]
    # Existing release tags have no "v" prefix (2.3.0, 2.2.5, ...);
    # match both styles so a plain "2.4.0" tag still triggers a build.
    tags: [ '[0-9]+.[0-9]+.[0-9]+', 'v*' ]
  pull_request:
    branches: [ main ]
  # One-click release: fill in the version (e.g. 2.4.0) and CI creates
  # the tag, builds, publishes the four executables and generates notes.
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to create (e.g. 2.4.0)'
        required: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore & build (Release)
        run: dotnet build RainyFetch.csproj -c Release

      # Quick sanity check: run the build on the runner and make sure it
      # actually prints system info without crashing.
      - name: Smoke test
        run: |
          .\bin\Release\net8.0-windows\RainyFetch.exe > smoke.txt
          if ($LASTEXITCODE -ne 0) { Write-Error "RainyFetch exited with $LASTEXITCODE"; exit $LASTEXITCODE }
          $size = (Get-Item smoke.txt).Length
          if ($size -lt 500) { Write-Error "Smoke output unexpectedly short ($size bytes)"; exit 1 }
          Write-Host "Smoke OK, $size bytes captured"

      # Release matrix matches the existing asset naming on the Releases page:
      # RainyFetch_<arch>.exe        = framework-dependent (needs the .NET 8 runtime)
      # RainyFetch_<arch>_runtime.exe = self-contained single file (runs anywhere)
      # Only the apphost exe is renamed; RainyFetch.dll / *.deps.json keep their names.
      - name: Publish win-x64 (framework-dependent)
        run: |
          dotnet publish RainyFetch.csproj -c Release -r win-x64 --self-contained false -o bin/publish/x64
          Remove-Item bin/publish/x64/*.pdb -ErrorAction SilentlyContinue
          Rename-Item bin/publish/x64/RainyFetch.exe RainyFetch_x64.exe

      - name: Publish win-x64 (self-contained single file)
        run: |
          dotnet publish RainyFetch.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o bin/publish/x64-runtime
          Remove-Item bin/publish/x64-runtime/*.pdb -ErrorAction SilentlyContinue
          Rename-Item bin/publish/x64-runtime/RainyFetch.exe RainyFetch_x64_runtime.exe

      - name: Publish win-x86 (framework-dependent)
        run: |
          dotnet publish RainyFetch.csproj -c Release -r win-x86 --self-contained false -o bin/publish/x86
          Remove-Item bin/publish/x86/*.pdb -ErrorAction SilentlyContinue
          Rename-Item bin/publish/x86/RainyFetch.exe RainyFetch_x86.exe

      - name: Publish win-x86 (self-contained single file)
        run: |
          dotnet publish RainyFetch.csproj -c Release -r win-x86 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o bin/publish/x86-runtime
          Remove-Item bin/publish/x86-runtime/*.pdb -ErrorAction SilentlyContinue
          Rename-Item bin/publish/x86-runtime/RainyFetch.exe RainyFetch_x86_runtime.exe

      - uses: actions/upload-artifact@v4
        with:
          name: RainyFetch_x64
          path: bin/publish/x64
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: RainyFetch_x64_runtime
          path: bin/publish/x64-runtime
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: RainyFetch_x86
          path: bin/publish/x86
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: RainyFetch_x86_runtime
          path: bin/publish/x86-runtime
          if-no-files-found: error

  # Runs on a tag push, or on a manual dispatch that supplies the version.
  # Dispatch: the release API creates the tag at target_commitish, and the
  # fallback step below makes sure it really exists on the remote.
  release:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            artifacts/RainyFetch_x64/RainyFetch_x64.exe
            artifacts/RainyFetch_x64_runtime/RainyFetch_x64_runtime.exe
            artifacts/RainyFetch_x86/RainyFetch_x86.exe
            artifacts/RainyFetch_x86_runtime/RainyFetch_x86_runtime.exe

      - name: Ensure the git tag exists (dispatch only)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ inputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag is present on the remote."
          else
            echo "Tag $tag missing; creating it from ${{ github.sha }}."
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$tag" "${{ github.sha }}"
            git push origin "$tag"
          fi
